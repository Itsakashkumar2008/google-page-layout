
<!DOCTYPE html>
<html>
<head>
    <title>Google Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top">
        <a href="https://about.google/">About</a>
        <a href="https://store.google.com/">Store</a>

        <div class="right">
            <a href="https://mail.google.com/">Gmail</a>
            <a href="https://images.google.com/">Images</a>
        </div>
    </div>
    <div class="main">
        <h1 class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </h1>
        <form action="https://www.google.com/search" method="get">
            <input type="text" name="search" class="search-box"
                   placeholder="Search Google or type a URL">
            <div class="buttons">
                <button type="submit">Google Search</button>
                <button type="button"
                    onclick="window.location.href='https://www.google.com/search?rlz=1C1GCEA_enIN1230IN1230&sourceid=chrome&ie=UTF-8&amc=1&gs_lcrp=EgZjaHJvbWUqGAgAEAAYQhi0AhjqAhjwBRieBhjKBhiMBzIYCAAQABhCGLQCGOoCGPAFGJ4GGMoGGIwHMhgIARAAGEIYtAIY6gIY8AUYngYYygYYjAcyGAgCEAAYQhi0AhjqAhjwBRieBhjKBhiMB9IBDjkzNzU3NDk4MWowajMxqAIDsAIB&oq=&udm=50&cud=0&atvm=1&sxsrf=APpeQntcG-hWrepqwNBHO-jkbQ1ErgiXNg%3A1791717470668&zs=1'">
                    Do More With AI
                </button>
            </div>
        </form>
    </div>
    <div class="footer">
        <a href="https://ads.google.com/">Advertising</a>
        <a href="https://business.google.com/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>

        <div class="footer-right">
            <a href="https://policies.google.com/privacy">Privacy</a>
            <a href="https://policies.google.com/terms">Terms</a>
        </div>
    </div>

</body>
</html>
